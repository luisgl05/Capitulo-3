        <h1>EJERCICIO 3.8</h1>
            <p>INTRODUCCIÓN: Cree un elemento input autocomplete con un elemento datalist asociado que contenga los días de la semana
            </p>
        <hr>
        <h2>Formulario de la semana</h2>
        <form action="procesar.php" method="post">
            <label for="dia">Selecciona un día de la semana:</label>
            <input type="text" id="dia" name="dia" list="listaDias" placeholder = "Selecciona un día de la semana">
            <datalist id="listaDias">
                <option value="Lunes">
                <option value="Martes">
                <option value="Miércoles">
                <option value="Jueves">
                <option value="Viernes">
                <option value="Sábado">
                <option value="Domingo">
            </datalist>
        </form>
