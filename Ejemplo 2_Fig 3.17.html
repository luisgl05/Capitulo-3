<!DOCTYPE html>
<!--Ejemplo 2 del librio cap 3-->

<!--El nuevo atributo autocomplete y el elemento datalist de formularios de HTML 5-->
<html>
    <head>
        <meta charset="utf-8">
        <title>El nuevo atributo autocomplete y el elemento datalist de formularios de HTML 5</title>
    </head>
    <body>
        <h2>EJEMPLO 3.17</h2>
        <h2>Demo de autocomplete y datalist</h2>
        <p>
            Este formulario desmuestra el atributo autocomplete de HTML y el elemento datalist
        </p>

        <form method="post" autocomplete="on">
            <p><label>Primer nombre:
                <input type="text" id="primerNombre" placeholder="Primer Nombre"/>(Primer Nombre)
            </label></p>

            <p><label>Apellido:
                <input type="text" id="apellido" placeholder="Apellido"/> (Apellido)
            </label></p>

            <p><label>Email:
                <input type="email" id="email" placeholder="nombre@dominio.com"/>(nombre@dominio.com)
            </label></p>

            <p><label for="listaTexto">Mes de nacimiento:
                <input type="text" id="listaTexto" placeholder="Seleccione un mes" list="meses"/>
                <datalist id="meses">
                    <option value="Enero"></option>
                    <option value="Febrero"></option>
                    <option value="Marzo"></option>
                    <option value="Abril"></option>
                    <option value="Mayo"></option>
                    <option value="Junio"></option>
                    <option value="Julio"></option>
                    <option value="Agosto"></option>
                    <option value="Septiembre"></option>
                    <option value="Octubre"></option>
                    <option value="Noviembre"></option>
                    <option value="Diciembre"></option>
                </datalist>
            </label></p>
            <p><input type="submit" value="Enviar"/>
                <input type="reset" values="Borrar"/>
            </p>
        </form>

        <p>
            <a href="Menu.html"><input type="button" value="Menu principal">
        </p>
        
    </body>
</html>
